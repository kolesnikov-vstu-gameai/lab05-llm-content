[project]
name = "lab05-llm-content"
version = "0.1.0"
description = "Учебный проект по дисциплине «Игровой ИИ»"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30",
    "anthropic>=0.28",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "streamlit>=1.33",
    "requests>=2.31"
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pre-commit>=3"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["notebooks", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
